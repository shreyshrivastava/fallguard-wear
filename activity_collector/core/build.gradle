plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Shared fall-detection logic used by the phone app (:app) and the watch app (:wear).
android {
    namespace 'com.example.activitycollector.core'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'

    // PyTorch Mobile runs the on-device model. Planned replacement: LiteRT or ExecuTorch.
    api 'org.pytorch:pytorch_android_lite:1.13.1'
}
